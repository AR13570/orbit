<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A pullback gravity journey." />
    <link
      rel="icon"
      type="image/x-icon"
      href="%BASE_URL%favicon.ico"
      sizes="16x16 32x32 48x48 64x64 128x128 256x256"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%orbit.svg" sizes="any" />
    <link
      rel="preload"
      href="%BASE_URL%fonts/Righteous-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <script>
      try {
        const t = localStorage.getItem("orbit.theme.v1");
        document.documentElement.dataset.theme =
          t === "light" ? "light" : "dark";
        if (t === "light")
          document.querySelector('meta[name="theme-color"]').content =
            "#e9ecef";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>Orbit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
